name: Deploy tested images
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment (the existing Beijing ECS)
        required: true
        type: choice
        options: [aliyun-prod]
      build_run_id:
        description: Successful Container CI and build run ID (copy from its summary)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.run.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful build from this repository's main branch
        id: run
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.BUILD_RUN_ID)) throw new Error('Invalid build run ID');
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(process.env.BUILD_RUN_ID) });
            const { data: workflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: run.workflow_id });
            if (workflow.path !== '.github/workflows/ci.yml' || run.head_branch !== 'main' ||
                run.head_repository?.full_name !== `${owner}/${repo}` || run.status !== 'completed' ||
                run.conclusion !== 'success' || !['push', 'workflow_dispatch'].includes(run.event) ||
                !/^[a-f0-9]{40}$/.test(run.head_sha)) throw new Error('Select a successful main-branch Container CI and build run');
            core.setOutput('revision', run.head_sha);

  deploy:
    needs: resolve
    environment: ${{ inputs.target }}
    concurrency:
      group: inkmind-deploy-${{ inputs.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      # Keep image references within this job. GitHub may suppress job outputs
      # containing registry/namespace values that are configured as Secrets.
      - uses: actions/download-artifact@v4
        with:
          name: inkmind-images
          path: image-metadata
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Resolve immutable image
        id: metadata
        env:
          EXPECTED_REVISION: ${{ needs.resolve.outputs.revision }}
          EXPECTED_RUN_ID: ${{ inputs.build_run_id }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY || vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE || vars.ACR_NAMESPACE }}
        run: python3 deploy/cloud/image_metadata.py resolve image-metadata/image.json
      - name: Deploy the tested image using its matching release scripts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.ALIYUN_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER || secrets.ALIYUN_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY || secrets.ALIYUN_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || secrets.ALIYUN_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'aliyun-prod' }}
          TARGET_ENVIRONMENT: ${{ inputs.target }}
          BACKEND_IMAGE: ${{ steps.metadata.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.metadata.outputs.frontend }}
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: bash deploy/cloud/publish.sh
      - name: Record deployment
        env:
          TARGET: ${{ inputs.target }}
          BACKEND_IMAGE: ${{ steps.metadata.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.metadata.outputs.frontend }}
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          printf 'Target: `%s`\n\nBackend: `%s`\n\nFrontend: `%s`\n\nRevision: `%s`\n' "$TARGET" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
